
name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          unzip -q JarvisAI-AndroidIDE-Fixed.zip -d extracted
          find extracted -maxdepth 3 -type f | head -30

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$PROJECT" || { echo "Android project not found"; exit 1; }
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
