
name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | head -1)

          if [ -z "$MANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using: $MANAGER"
          yes | "$MANAGER" --licenses || true
          "$MANAGER" "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p extracted
          unzip -q JarvisAI-AndroidIDE-Fixed.zip -d extracted
          find extracted -maxdepth 3 -type f | head -30

      - name: Build APK
        shell: bash
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
