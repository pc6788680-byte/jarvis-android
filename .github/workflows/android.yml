
name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract JARVIS ZIP
        run: |
          unzip -q JarvisAI-AndroidIDE-Fixed.zip -d extracted
          ls -la extracted/JarvisAI-AndroidIDE-Fixed

      - name: Build APK
        working-directory: extracted/JarvisAI-AndroidIDE-Fixed
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: extracted/JarvisAI-AndroidIDE-Fixed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
